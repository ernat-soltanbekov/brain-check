name: Audit checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend scripts
      - run: ruff format --check backend scripts
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: pytest -q
      - run: |
          python backend/manage.py migrate --noinput
          python backend/manage.py seed_demo
          python backend/manage.py runserver 127.0.0.1:8000 --noreload &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health/ && break || sleep 1; done
          python scripts/stress_test.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
